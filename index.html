<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dream Travel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🌍 My Dream Travel</h1>

    <div class="cards">

        <div class="card">
            <img src="images/japan.png" alt="Japan">
            <h2>Japan</h2>
            <p>I want to visit Tokyo and see cherry blossoms.</p>
        </div>

        <div class="card">
            <img src="images/italy.png" alt="Italy">
            <h2>Italy</h2>
            <p>I would like to visit Rome and eat real Italian pizza.</p>
        </div>

        <div class="card">
            <img src="images/canada.png" alt="Canada">
            <h2>Canada</h2>
            <p>I dream of seeing beautiful mountains and lakes.</p>
        </div>

    </div>

    <button>My Favorite Country</button>

</div>

</body>
</html>
